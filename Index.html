<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Biometric Zero-Knowledge Gateway</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #161b22;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .camera-box {
            position: relative;
            width: 100%;
            height: 260px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #238636;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .iris-scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 2px dashed #00ffcc;
            border-radius: 50%;
            animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #2ea043; }
        .status { margin-top: 15px; font-size: 14px; color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <h2>आइरिस ऑथेंटिकेशन गेटवे</h2>
    <p style="font-size: 13px; color: #8b949e;">सुरक्षा: ज़ीरो-नॉलेज क्लाइंट-साइड बायोमेट्रिक</p>
    
    <div class="camera-box">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="iris-scanner-overlay"></div>
    </div>

    <button id="scanBtn" onclick="startIrisScan()">आँखें स्कैन करें (Scan Iris)</button>
    <div id="statusText" class="status">कैमरा कनेक्ट करने के लिए बटन दबाएं...</div>
</div>

<script>
    async function startIrisScan() {
        const video = document.getElementById('webcam');
        const status = document.getElementById('statusText');
        status.innerText = "कैमरा चालू हो रहा है... कृपया आँखों को सीधे देखें।";

        try {
            // 1. यूजर के कैमरे की अनुमति और स्ट्रीम प्राप्त करना
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            status.innerText = "आँखों का लाइवनेस और आइरिस पैटर्न विश्लेषित हो रहा है...";

            // 2. नकली स्कैनिंग सिमुलेशन (असली ऐप में MediaPipe / TensorFlow.js मॉडल लगेगा)
            setTimeout(async () => {
                // क्रिप्टोग्राफिक की (Cryptographic Key) जनरेट करना
                const fakeIrisVector = "USER_EYE_UNIQUE_BIOMETRIC_VECTOR_2026";
                const masterKey = await generateAESKey(fakeIrisVector);
                
                status.style.color = "#3fb950";
                status.innerText = "सफलता! बायोमेट्रिक सत्यापित। एडमिन पैनल अनलॉक हो गया है।";
            }, 3000);

        } catch (err) {
            status.style.color = "#f85149";
            status.innerText = "कैमरा एक्सेस नहीं मिला या ब्राउज़र सपोर्ट नहीं करता।";
            console.error(err);
        }
    }

    // AES-256 वेब क्रिप्टो की जनरेटर
    async function generateAESKey(secretSeed) {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw", enc.encode(secretSeed), "PBKDF2", false, ["deriveKey"]
        );
        return window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: enc.encode("unique_salt_12345"),
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            true,
            ["encrypt", "decrypt"]
        );
    }
</script>

</body>
</html>
